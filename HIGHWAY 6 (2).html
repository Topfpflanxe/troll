function toast(x){const e=$('#ts');e.textContent=x;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,1000)}
function reset(){cars.forEach(c=>sc.remove(c.g));cars=[];Object.assign(P,{s:0,d:LD[1],v:24,psi:0,lean:0,lv:0,sm:0});T=0;pts=0;nOv=0;nCl=0;avgV=24;
for(let i=0;i<60;i++)spawn(1,rn(-70,430));for(let i=0;i<30;i++)spawn(-1,rn(-60,430));
cars=cars.filter(c=>{if(c.dir>0&&Math.abs(c.s)<30&&Math.abs(c.d-P.d)<3.5){sc.remove(c.g);return 0}return 1});$('#ov').style.display='none';st='run'}
let best={};try{best=JSON.parse(localStorage.hw6||'{}')}catch(e){}
function ovl(h,b,btn){const o=$('#ov');o.innerHTML=`<h1>${h}</h1><div>${b}</div><button onclick="reset()">${btn}</button>`;o.style.display='flex'}
function finish(k){if(st=='end')return;const bonus=k=='win'?Math.round((TL-T)*10):0,tot=Math.round(pts+bonus+P.s/10);st='end';
if(k=='win'&&(!best.t||T<best.t))best.t=T;if(!best.p||tot>best.p)best.p=tot;try{localStorage.hw6=JSON.stringify(best)}catch(e){}
const stat=`${nOv} Fahrzeuge überholt · ${nCl} knappe Manöver<br>Punkte: <b>${tot}</b> · Rekord ${best.p}${best.t?` · Bestzeit ${best.t.toFixed(1)} s`:''}`;
ovl(k=='win'?'ZIEL!':k=='time'?'ZEIT ABGELAUFEN':'UNFALL',(k=='win'?`5 km in ${T.toFixed(1)} s.<br>`:k=='time'?`Nur ${(P.s/1000).toFixed(2)} km geschafft.<br>`:`Bei ${(P.s/1000).toFixed(2)} km ist Schluss.<br>`)+stat,'Nochmal')}
function step(dt){
if(st=='run'){T+=dt;const sT=K.d-K.a;P.sm+=(sT-P.sm)*Math.min(1,dt*(sT?7:9));
if(K.w)P.v+=(54-P.v)*.3*dt;else if(K.s)P.v-=13*dt;else P.v+=(avgV-P.v)*.8*dt;P.v=cl(P.v,5,54);
P.vl=P.vl||0;P.vl+=(P.sm*(5+P.v*.18)-P.vl)*Math.min(1,dt*5);P.lean=P.vl/(5+P.v*.18)*.5;
P.psi=Math.atan2(P.vl,P.v)*.6;
P.d+=P.vl*dt;P.s+=P.v*dt;
if(P.d<-10.5){P.d=-10.5;if(P.psi<-.3)return crash(-1);P.psi=Math.max(P.psi,0);P.v*=1-.8*dt}
if(P.d>10.5){P.d=10.5;if(P.psi>.3)return crash(1);P.psi=Math.min(P.psi,0);P.v*=1-.8*dt}
if(P.s>=GOAL)finish('win');else if(T>=TL)finish('time')}
else if(st=='crash'){crT+=dt;P.lean+=(crD*1.45-P.lean)*dt*6;P.v*=Math.exp(-1.6*dt);P.s+=P.v*dt;P.d=cl(P.d+crD*P.v*.05*dt,-10.4,10.4);if(crT>1.7)finish('crash')}
else if(st=='end'){P.v*=Math.exp(-.3*dt);P.s+=P.v*dt;P.lean*=.95}
// traffic
let sum=0,nn=0;
for(const c of cars){if(c.dir>0){const{b,g}=lead(c);let tv=c.vd;if(b){if(g<8)tv=Math.min(tv,b.v-4);else if(g<28)tv=Math.min(tv,b.v+(g-8)*.1)}
c.v+=tv>c.v?Math.min(2.5*dt,tv-c.v):-Math.min(9*dt,c.v-tv);c.cool-=dt;
if(c.cool<=0&&((b&&g<35&&c.vd>b.v+1.5)||Math.random()<dt*.02)){const o=[c.lane-1,c.lane+1].filter(n=>n>=0&&n<3&&free(c,n));if(o.length){c.lane=o[Math.random()*o.length|0];c.cool=7}else c.cool=1}
c.d+=cl(LD[c.lane]-c.d,-2.4*dt,2.4*dt);c.s+=c.v*dt;
if(Math.abs(c.s-P.s)<300){sum+=c.v;nn++}
if(st=='run'){const ds=Math.abs(c.s-P.s);if(ds<(c.t.l+2)/2+7)c.mg=Math.min(c.mg,Math.abs(P.d-c.d)-(c.t.w+.7)/2);
if(ds<(c.t.l+2)/2&&Math.abs(c.d-P.d)<(c.t.w+.7)/2)return crash(c.d<P.d?1:-1);
const ah=c.s>P.s?1:0;if(c.ah==1&&!ah){nOv++;pts+=10;if(c.mg<.7){nCl++;const bn=Math.round(40+P.v);pts+=bn;toast('KNAPP! +'+bn)}}c.ah=ah}}
else{c.s-=c.v*dt;if(st=='run'){if(Math.abs(c.s-P.s)<(c.t.l+2)/2+.5&&Math.abs(c.d-P.d)<(c.t.w+.7)/2)return crash(c.d<P.d?1:-1);const ah=c.s>P.s?1:0;if(c.ah==1&&!ah&&Math.abs(c.d-P.d)<(c.t.w+.7)/2+1.4){nCl++;pts+=120;toast('FRONTAL KNAPP! +120')}c.ah=ah}}
const lat=c.dir>0?cl(LD[c.lane]-c.d,-.8,.8)*.12:0;c.g.position.set(cx(c.s)+c.d,0,-c.s);c.g.rotation.y=-(th(c.s)+lat)+(c.dir<0?Math.PI:0)}
if(nn)avgV+=(sum/nn-avgV)*dt*.5;
tick-=dt;if(tick<=0){tick=.2;const d=dens(),nf=cars.filter(c=>c.dir>0).length,no=cars.length-nf;
if(nf<8+d*38)Math.random()<.25?spawn(1,P.s-95,1):spawn(1,P.s+rn(390,430));if(no<6+d*24)spawn(-1,P.s+rn(390,430));
cars=cars.filter(c=>{if(c.s<P.s-120||c.s>P.s+440){sc.remove(c.g);return 0}return 1})}}
function crash(dir){if(st!='run')return;st='crash';crT=0;crD=dir;toast('')}
// audio
let AC,eo,eg,wg,aon=0;$('#snd').onclick=()=>{aon=!aon;$('#snd').textContent='Sound: '+(aon?'an':'aus');
if(!AC&&aon){AC=new AudioContext;eo=AC.createOscillator();eo.type='sawtooth';const f=AC.createBiquadFilter();f.frequency.value=500;eg=AC.createGain();eo.connect(f).connect(eg).connect(AC.destination);eo.start();
const L2=AC.sampleRate*2,b=AC.createBuffer(1,L2,AC.sampleRate),da=b.getChannelData(0);for(let i=0;i<L2;i++)da[i]=Math.random()*2-1;const n=AC.createBufferSource();n.buffer=b;n.loop=true;const f2=AC.createBiquadFilter();f2.frequency.value=900;wg=AC.createGain();n.connect(f2).connect(wg).connect(AC.destination);n.start()}
if(AC)aon?AC.resume():AC.suspend()};
// loop
let last=0;
function loop(tm){requestAnimationFrame(loop);const dt=Math.min(.05,(tm-last)/1e3);last=tm;if(st!='ready'||cars.length)step(dt);
const Th=th(P.s)+P.psi*.2;cy+=(Th-cy)*Math.min(1,dt*5);const f=new THREE.Vector3(Math.sin(cy),0,-Math.cos(cy)),bx=cx(P.s)+P.d;
bike.visible=false;
if(!cam.cp){cam.cp=new THREE.Group();[...cam.children].forEach(o=>cam.cp.add(o));cam.add(cam.cp)}P.cd=P.cd==null?P.d:P.cd+(P.d-P.cd)*Math.min(1,dt*5);const cb=cx(P.s)+P.cd;cam.position.set(cb+f.x*.15,1.32+Math.sin(tm/25)*.003*P.v/54,-P.s+f.z*.15);cam.lookAt(cb+f.x*30,1.05,-P.s+f.z*30);cam.rotateZ(-P.lean*.1);cam.cp.rotation.z=-P.lean*.8;cam.cp.rotation.y=-P.sm*.05;cam.cp.position.x=P.sm*.04;hb2.rotation.y=-P.sm*.2;dash(P.v);
cam.fov=68+Math.max(0,P.v-20)*.6;cam.updateProjectionMatrix();sky.position.copy(cam.position);
grass.position.set(Math.round(bx/8)*8,-.02,-Math.round(P.s/8)*8);segs();
if(st!='ready'){const kmh=P.v*3.6;$('#sp').innerHTML=Math.round(kmh)+'<small> km/h</small>';$('#tm').textContent=Math.max(0,TL-T).toFixed(1)+' s';
$('#pf').style.width=Math.min(100,P.s/GOAL*100)+'%';$('#pt').textContent=(P.s/1000).toFixed(2)+' / 5 km';$('#sc').textContent=Math.round(pts+P.s/10)+' Pkt';$('#vg').style.opacity=cl((P.v-30)/40,0,.8)}
if(AC&&aon){eo.frequency.value=45+P.v*3.2;eg.gain.value=st=='crash'?0:.05;wg.gain.value=P.v/54*.22}
R.render(sc,cam)}
reset();st='ready';ovl('HIGHWAY 6',`5 km in 180 Sekunden. Der Verkehr fährt im Schnitt langsamer als dein Ziel verlangt:<br>du musst dich durchschlängeln.<br><br><b>W / S</b> Gas / Bremse · <b>A / D</b> oder Pfeile lenken<br>Ohne Gas fährst du genau im Verkehrsfluss mit.<br>Keine Leitplanke: die Gegenspur ist offen. Vorsicht.${best.p?`<br><br>Rekord: ${best.p} Pkt${best.t?` · Bestzeit ${best.t.toFixed(1)} s`:''}`:''}`,'Losfahren');
requestAnimationFrame(loop);
</script></body></html>
