const x=st.mail[st.mv];return `<button onclick="st.mv=-1;draw('mail')">&lt; Inbox</button><button onclick="st.hh=!st.hh;if(st.hh&&${x.h?1:0}){S.hdr=1;save()}draw('mail')">Headers</button><pre><b>From:</b> ${x.f}\n<b>Subj:</b> ${x.s}\n${st.hh?"Received: halvern-mx1\nX-Originating-Desk: "+(x.h?"404":[112,230,301,388,150][x.s.length%5])+"\n":""}\n${x.b}</pre>`}},
tickets:{t:"IT Tickets",w:400,f:()=>{const q=S.done<T.length&&Date.now()>=st.at;if(!q)return "<pre>Queue empty.\n\nLast closed: "+(S.done?T[S.done-1][0]:"-")+"</pre>";const t=T[S.done],j=S.done;
return `<pre><b>#${4400+j*17}  ${t[0]}</b>\nFrom: ${t[1]}  Desk: ${t[2]}\n\n${t[3]}</pre>`+(t[6]=="b"?"<i>Resolve in Building Controls.</i>":t[4].map((o,n)=>`<div><button onclick="opt(${n})">${o}</button></div>`).join(""))+`<pre class=d>${st.msg}</pre>`}},
chat:{t:"Chat",w:330,f:()=>{const c=CT[st.cc];return CT.map((x,i)=>{const on=x[1]<0||(w[x[1]]&&m[x[1]]);return `<button onclick="st.cc=${i};draw('chat')"><span class=${on?"g":"d"}>●</span> ${x[0]}</button>`}).join("")+`<pre>${CT[st.cc][1]<0||(w[CT[st.cc][1]]&&m[CT[st.cc][1]])?CT[st.cc][0]+": "+CT[st.cc][2][stage()]:"offline - last seen 09:12"}</pre>`}},
files:{t:"Explorer",w:360,f:()=>{if(st.f<0)return ["roster.csv","logs.txt","notes.txt"].concat(S.done>=9?["restore.bat"]:[]).map((x,i)=>`<div><button onclick="st.f=${i};draw('files')">${x}</button></div>`).join("");
const b=`<button onclick="st.f=-1;draw('files')">&lt; Back</button>`;const al=[...w].reduce((a,b)=>a+b,0);
if(st.f==0)return b+`<pre>ID,NAME,DESK,STATUS\n1,AMES L.,112,${w[PI-2]?"ACTIVE":"INACTIVE"}\n2,PRUITT D.,230,${w[PI+1]?"ACTIVE":"INACTIVE"}\n3,WEIR T.,388,${w[5*G+12]?"ACTIVE":"INACTIVE"}\n4,MARLOW O.,404,ACTIVE (since 1999-03-02)\n...\nACTIVE: ${al} / 441</pre>`;
if(st.f==1)return b+`<pre>${S.done<5?"no entries":T.slice(5,Math.min(S.done,9)).map(x=>"OFFBOARD "+x[0].slice(10)+"  origin: DESK 404").join("\n")}</pre>`;
if(st.f==2)return b+`<pre>IT handover.\nNever offboard without a second approver.\nIf the lights go, the exit is Fire Door E-9.\n- previous tech, O.M.</pre>`;
return b+`<pre>RESTORE ALL DIRECTORY ACCOUNTS.\nThis cannot be undone.</pre><button onclick="end('B')">Run</button>`}},
cctv:{t:"CCTV",w:300,f:()=>`<button onclick="st.cam=0;draw('cctv')">1</button><button onclick="st.cam=1;draw('cctv')">2</button><button onclick="st.cam=2;draw('cctv')">3</button><canvas id=cv width=252 height=84 style="display:block;background:#000"></canvas><pre>REC 02 MAR 09:14:07</pre>`},
remote:{t:"Remote Desktop",w:340,f:()=>[112,230,388,404].map(d=>`<button onclick="st.rd=${d};if(${d}==388)st.rem=1;draw('remote')">Desk ${d}</button>`).join("")+`<pre>${st.rd==404?"Session in use by: you":st.rd==388?(w[5*G+12]?"[Notepad]\ndo not close this session":"Session active. User not present."):st.rd?"Session active. User not present.":"Select a desk."}</pre>`},
build:{t:"Building Controls",w:300,f:()=>`<b>Lighting</b><br>${["A","B","C","D"].map(z=>`<button onclick="zone('${z}')">Reset Zone ${z}</button>`).join("")}<pre class=d>${st.zm||""}</pre><b>Fire Door E-9</b><pre>PIN: ${st.pin.replace(/./g,"*")}</pre>${[1,2,3,4,5,6,7,8,9,0].map(n=>`<button onclick="st.pin=(st.pin+${n}).slice(0,4);draw('build')">${n}</button>`).join("")}<button onclick="if(st.pin=='7316')end('C');else{st.pin='';st.zm='Invalid PIN';draw('build')}">Open</button>`},
cal:{t:"Calendar",w:280,f:()=>"<pre><b>TUE 2 MARCH</b>\n09:00 Standup (cancelled)\n12:00 Lunch\n15:00 Headcount review\n\nTUE 2 MARCH\n15:00 Headcount review</pre>"}};
const CT=[["Linda Ames",PI-2,["morning! P-12 is being weird again","off to the kitchenette, back soon","(away)"]],["Dev Pruitt",PI+1,["I forgot my password. Again.","do you ever take lunch?","which desk are you at?"]],["Tomas Weir",5*G+12,["VPN is down, sorry!","I will stay late, no rush","you there?"]],["Facilities",-1,["Zone C lighting: nominal","Zone C lighting: nominal","Zone D lighting: no response"]]];
const IC=[["mail","✉","Mail"],["tickets","▤","Tickets"],["chat","☺","Chat"],["files","▣","Files"],["cctv","◉","CCTV"],["remote","▭","Remote"],["build","⚙","Building"],["cal","▦","Calendar"]];
$('#ic').innerHTML=IC.map((x,i)=>`<div class=i style="top:${14+i*74}px" onclick="openw('${x[0]}')"><b>${x[1]}</b>${x[2]}</div>`).join("");
function openw(id){let o=ws[id];if(!o){o=ws[id]=document.createElement('div');o.className='w';const n=Object.keys(ws).length;o.style.cssText=`left:${100+n*26}px;top:${24+n*24}px;width:${Math.min(AP[id].w,innerWidth-110)}px`;
o.innerHTML=`<div class=t><span>${AP[id].t}</span><span style="cursor:pointer" onclick="clw('${id}')">✕</span></div><div class=b></div>`;$('#ov').appendChild(o);
const tb=o.firstChild;tb.onmousedown=e=>{const ox=e.clientX-o.offsetLeft,oy=e.clientY-o.offsetTop;o.style.zIndex=++zi;document.onmousemove=ev=>{o.style.left=ev.clientX-ox+'px';o.style.top=ev.clientY-oy+'px'};document.onmouseup=()=>{document.onmousemove=null}}}
o.style.zIndex=++zi;draw(id)}
function clw(id){ws[id].remove();delete ws[id]}
function draw(id){const o=ws[id];if(!o)return;const b=o.lastChild,s=b.scrollTop;b.innerHTML=AP[id].f();b.scrollTop=s;if(id=='cctv')cctv()}
function cctv(){const c=$('#cv');if(!c)return;const g=c.getContext('2d'),r0=st.cam*7;if(p>.5+.12*(2-st.cam)&&st.cam>0){g.fillStyle='#222';g.fillRect(0,0,252,84);g.fillStyle='#999';g.fillText('NO SIGNAL',90,44);return}
for(let r=0;r<7;r++)for(let q=0;q<G;q++){const i=(r0+r)*G+q;g.fillStyle=(p-.12<thr[i])||i==PI?'#2a3a22':'#0c0e0a';g.fillRect(q*12,r*12,11,11);if((p-.12<thr[i]||thr[i]>8)&&i!=PI&&w[i]){g.fillStyle='#8c8';g.fillRect(q*12+4,r*12+4,4,4)}}}
function ui(){Object.keys(ws).forEach(draw);$('#tk').textContent=S.done<T.length&&Date.now()>=st.at?"[1 new ticket]":"";const d=new Date(0,0,0,9,14+S.done*37);$('#clk').textContent=(S.done>=10?"4:04":d.getHours()+":"+String(d.getMinutes()).padStart(2,"0"))}
setInterval(()=>{if($('#ov').style.display=='block')ui()},1500);
function zone(z){if(z=='C'){if(S.done==2&&Date.now()>st.at){st.zm="Zone C reset.";closeT()}else st.zm="Zone C nominal."}else st.zm="Zone "+z+" nominal.";draw('build')}
function closeT(){const k=S.done;S.done++;st.msg="";st.at=Date.now()+14e3+Math.random()*14e3;fx(k);save();ui();if(A&&aon)click(.2)}
function opt(n){const t=T[S.done];if(S.done==10){if(n==0)return end('A');st.msg=n==1?"HR Ops: request origin is desk 404.":"The restore tool is in Files.";return draw('tickets')}
if(n!=t[5])st.msg=t[6]=="o"?(n==1?"The request was resubmitted by HR Ops.":"Linda is not responding in Chat."):"That did not resolve it.";
else if(t[6]=="r"&&!st.rem)st.msg="Check his session in Remote Desktop first.";else return closeT();draw('tickets')}
// ---- endings
const ET={A:"Account O. MARLOW deactivated.\nActive accounts: 0.\n\nThe hum stops.",B:"Restore complete.\nActive accounts: 441.\n\nEveryone is back.\nNobody looks up.",C:"The fire door opens onto grey morning.\nThe car park is empty.\nYour phone buzzes once.\n\n1 new ticket.\nFrom: DESK 404"};
function end(k){if(st.ended)return;st.ended=k;leave();S.end.push(k);S.runs++;S.done=0;save();const o=[...Array(N).keys()].filter(i=>i!=PI).sort((a,b)=>Math.hypot(X(a),Z(a)-pz)-Math.hypot(X(b),Z(b)-pz));if(k!='B')o.reverse();
setTimeout(()=>{const iv=setInterval(()=>{for(let n=0;n<8;n++){const i=o.shift();if(i==null){clearInterval(iv);flush();setTimeout(fin,4e3);return}
if(k=='B'){w[i]=m[i]=l[i]=1}else{w[i]=m[i]=0;l[i]=k=='C'&&i>N-40?1:0}paint(i);dw(i,0)}flush()},60)},2500);
function fin(){const e=$('#en');e.style.display='flex';e.innerHTML=ET[k]+"\n\nEndings found: "+[...new Set(S.end)].length+"/3\n\n<button onclick='location.reload()'>Again</button>";setTimeout(()=>e.style.opacity=1,50)}}
$('#go').onclick=()=>{begin();$('#st').style.display='none';st.t0=Date.now();say("Click the monitor.",6)};
$('#sv').textContent=S.runs?"Shifts worked: "+S.runs:"";
requestAnimationFrame(loop);
</script></body></html>
